---
name: Build container image
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  schedule:
    - cron: '00 05 * * 0'  # 5:00am UTC Sunday; about 1:00am Eastern during daylight time
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
  workflow_dispatch:

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on every pull request, which is the point: ci/write-badges.sh is
  # executed by no other trigger here. The `Status badges` workflow runs it on
  # a schedule and on workflow_run completion, and explicitly skips
  # pull_request, so before this job a change to that script reached main
  # having never run once, and first executed unattended at 06:30 UTC.
  tests:
    name: Shell tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tests/test-shell-syntax.sh skips its shellcheck pass when the tool is
      # absent, which keeps the suite usable on a developer machine. CI is
      # where that pass has to be enforced. PyYAML is required by the workflow
      # expression check, which fails if its parser is unavailable.
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          shellcheck --version

      - name: Run shell test suite
        env:
          # Use the interpreter where apt installed PyYAML, even if another
          # Python precedes it on the hosted runner's PATH.
          WORKFLOW_PYTHON: /usr/bin/python3
        run: ./tests/run-tests.sh

  build_push:
    name: Build and push image
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write
      # Build provenance: id-token mints the OIDC token Sigstore certifies,
      # attestations stores the result on this repository.
      id-token: write
      attestations: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This is optional, but if you see that your builds are way too big for the runners, you can enable this by uncommenting the following lines:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      # Ubuntu 24.04's Podman does not preserve Chunkah's layer annotations
      # when pushing. Use the same newer toolchain as Aurora until the hosted
      # runner includes a sufficiently new Podman release. The step skips
      # itself once the runner's podman major version is >= 5, so it retires
      # automatically when GitHub updates the hosted image.
      - name: Update Podman
        run: |
          set -eux
          need_major=5
          have_major=$(podman --version | grep -oE '[0-9]+' | head -n 1)
          if [ "${have_major}" -ge "${need_major}" ]; then
            echo "Runner podman is already >= ${need_major}; skipping cross-release install"
            exit 0
          fi
          echo "deb http://azure.archive.ubuntu.com/ubuntu resolute universe main" | sudo tee /etc/apt/sources.list.d/resolute.list
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades \
            crun/resolute \
            buildah/resolute \
            podman/resolute \
            skopeo/resolute
          podman --version

      # GitHub-hosted runners keep most of their free space on /mnt (~66G),
      # while / has far less headroom. Building the image and then re-layering
      # it with Chunkah keeps two copies of the root filesystem in podman's
      # storage at once, which can exhaust /. Relocate podman's rootless
      # storage onto /mnt so the rechunk has room. The image-copy temp dir is
      # deliberately left on / (freed by relocating storage) so the two large
      # consumers land on separate disks instead of competing for one.
      - name: Move container storage to the large runner disk
        run: |
          set -eux
          sudo mkdir -p /mnt/containers
          sudo chown "$(id -u):$(id -g)" /mnt/containers
          mkdir -p "${HOME}/.local/share"
          rm -rf "${HOME}/.local/share/containers"
          ln -s /mnt/containers "${HOME}/.local/share/containers"
          df -h / /mnt

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=Aurora DX image with ZFS support
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v2
        with:
          containerfiles: |
            ./Containerfile
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false

      # Post-process the completed image so the ZFS and replacement-kernel
      # content is chunked along with the inherited Aurora filesystem.
      #
      # Chunkah's output used to be piped straight into `podman load`, which
      # forced the source image and the re-layered copy to coexist in one
      # container storage (~2x the unpacked image) and exhausted the runner
      # disk intermittently. Instead, buffer the compressed archive to a file
      # on / , delete the source image to free its layers, and only then load
      # the archive with its unpack temp dir pointed at /mnt. Neither disk
      # ever has to hold two unpacked copies of the image at once.
      - name: Rechunk Image with Chunkah
        env:
          CHUNKAH_IMAGE: quay.io/coreos/chunkah:v0.7.0
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail

          source_image="localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          chunked_image="localhost/${IMAGE_NAME}:chunkah"
          archive=/tmp/chunkah-oci.tar
          # Chunkah documents --config-str as taking the `.Config` element
          # of a podman/docker inspect, not the whole document. A full
          # inspect also carries RootFS.Layers, History and
          # GraphDriver.Data.LowerDir, all of which scale with the base
          # image's layer count. The value is handed to podman as an
          # environment variable below, and Linux caps a single argv/env
          # string at MAX_ARG_STRLEN (32 pages = 128 KiB); once the Aurora
          # base grew from 128 to 256 layers the full form crossed that cap
          # and exec failed with E2BIG ("Argument list too long", exit 126).
          # `.Config` holds only Env/Cmd/WorkingDir/Labels and stays ~1.5 KiB
          # no matter how many layers the base grows to.
          export CHUNKAH_CONFIG_STR
          CHUNKAH_CONFIG_STR="$(podman inspect --format '{{json .Config}}' "${source_image}")"

          # kernel-akmods.sh erases Aurora's kernel and installs the one from
          # the akmods image, but the `.Config` above is inherited from
          # aurora-dx, so its `ostree.linux` label names Aurora's kernel.
          # Whenever the akmods stream is ahead of Aurora stable (the normal
          # state, see AGENTS.md) that label is wrong for this image. Read
          # the kernel actually installed in the built image and label it
          # with that. The query is pinned to kernel-core rather than the
          # upstream akmods tag, which can move between the build and now.
          shipped_kernel="$(podman run --rm --entrypoint rpm "${source_image}" \
            -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core)"
          if [ -z "${shipped_kernel}" ] || [ "$(printf '%s\n' "${shipped_kernel}" | wc -l)" -ne 1 ]; then
            echo "expected exactly one kernel-core in ${source_image}, got: '${shipped_kernel}'" >&2
            exit 1
          fi
          echo "==> Shipped kernel: ${shipped_kernel}"

          # Name the upstream images this build combined. The Containerfile
          # names all three by moving tags, so the commit alone does not say
          # which Aurora or akmods build went in, and the inherited
          # org.opencontainers.image.version that named the Aurora build is
          # overwritten by the metadata step. buildah left the copies it
          # pulled in storage; the prune below removes them, so read them now.
          upstream_ref() {
            local name="$1" ref
            ref="$(podman images --format '{{.Repository}}:{{.Tag}}@{{.Digest}}' \
              | grep -E "^ghcr\.io/ublue-os/${name}:" | sort -u)"
            if [ -z "${ref}" ] || [ "$(printf '%s\n' "${ref}" | wc -l)" -ne 1 ]; then
              echo "expected exactly one ghcr.io/ublue-os/${name} image in storage, got: '${ref}'" >&2
              return 1
            fi
            printf '%s\n' "${ref}"
          }
          base_ref="$(upstream_ref aurora-dx)"
          akmods_ref="$(upstream_ref akmods)"
          akmods_zfs_ref="$(upstream_ref akmods-zfs)"
          echo "==> Built from: ${base_ref} ${akmods_ref} ${akmods_zfs_ref}"

          echo "==> Disk usage before rechunk" && df -h / /mnt

          podman run --rm \
            --mount=type=image,src="${source_image}",target=/chunkah \
            -e CHUNKAH_CONFIG_STR \
            "${CHUNKAH_IMAGE}" build \
              --verbose \
              --compressed \
              --max-layers 128 \
              --prune /sysroot/ \
              --label ostree.commit- \
              --label ostree.final-diffid- \
              --label "ostree.linux=${shipped_kernel}" \
              --label "org.opencontainers.image.base.name=${base_ref%@*}" \
              --label "org.opencontainers.image.base.digest=${base_ref#*@}" \
              --label "org.aurora-zfs-simple.akmods-image=${akmods_ref}" \
              --label "org.aurora-zfs-simple.akmods-zfs-image=${akmods_zfs_ref}" \
              --label io.artifacthub.package.deprecated- \
              --label io.artifacthub.package.keywords- \
              --label io.artifacthub.package.logo-url- \
              --label io.artifacthub.package.maintainers- \
              --label io.artifacthub.package.readme-url- \
              --label quay.expires-after- \
              --tag "${chunked_image}" > "${archive}"

          # The archive is self-contained, so nothing left in container
          # storage is needed anymore: not the source image, not the Aurora
          # base or akmods images (tagged, so a plain prune would keep
          # them), not the Chunkah image. Remove them all so the load starts
          # against an empty store.
          podman image prune -af
          echo "==> Disk usage after pruning container storage" && df -h / /mnt

          # podman unpacks oci archives into TMPDIR before applying them;
          # keep that on /mnt next to container storage instead of /var/tmp.
          # /mnt is root-owned on the hosted runners, hence sudo + chown.
          sudo mkdir -p /mnt/tmp
          sudo chown "$(id -u):$(id -g)" /mnt/tmp
          TMPDIR=/mnt/tmp podman load -i "${archive}"
          rm -f "${archive}"
          echo "==> Disk usage after load" && df -h / /mnt

          for tag in ${TAGS}; do
            podman tag "${chunked_image}" "${IMAGE_NAME}:${tag}"
          done

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish under a tag no host follows, sign that digest, and only then
      # move `latest`. Hosts follow `latest`; pushing it first left it naming
      # an unsigned image whenever a later step failed, until the next build
      # signed one. The pushed tag is the first non-default tag the metadata
      # step generated (latest.YYYYMMDD), so the tag set itself is unchanged.
      - name: Pick the tag to push first
        id: first_tag
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            if [ "${tag}" != "${DEFAULT_TAG}" ]; then
              echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "no tag other than ${DEFAULT_TAG} to push first" >&2
          exit 1

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          # Push exactly one tag. The remaining tags are copied from the
          # pushed digest after signing so every tag is byte-identical.
          tags: ${{ steps.first_tag.outputs.tag }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.1'

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}

      # The cosign signature says this repository's key signed the digest. It
      # does not say which commit or workflow run produced it. A SLSA
      # provenance attestation names both, and anyone can check it with
      # `gh attestation verify` (see "Project Continuity & Trust" in the
      # README) without trusting the key at all.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories,
          # and would need the artifact-metadata scope besides.
          create-storage-record: false

      # podman can emit different manifest bytes for sequential pushes of
      # the same local image: the first push compresses and uploads, later
      # pushes reuse cached blob info, and the resulting manifests can carry
      # different digests. That split what `latest` and the date tags pointed
      # at and left `latest` outside the signed digest. Copy the single
      # pushed, signed manifest to the remaining tags server-side instead;
      # --preserve-digests makes skopeo fail rather than rewrite the
      # manifest, so every tag is identical by construction. `latest` is
      # copied last, so it moves only once every other tag holds the digest.
      - name: Propagate tags from the pushed digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
          FIRST_TAG: ${{ steps.first_tag.outputs.tag }}
        run: |
          set -euo pipefail
          digest="${DIGEST}"
          if [ -z "${digest}" ]; then
            echo "push step did not expose a digest" >&2
            exit 1
          fi
          copy_to() {
            skopeo copy --preserve-digests \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:$1"
          }
          for tag in ${TAGS}; do
            if [ "${tag}" = "${FIRST_TAG}" ] || [ "${tag}" = "${DEFAULT_TAG}" ]; then
              continue
            fi
            copy_to "${tag}"
          done
          copy_to "${DEFAULT_TAG}"

      # All tags in this job point at one manifest pushed from one local
      # image and signed above. Enforce that as an invariant instead of
      # trusting it: if any published tag resolves to a different digest
      # than the one that was signed, fail the run.
      - name: Verify pushed tags share one digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          expected="${DIGEST}"
          if [ -z "${expected}" ]; then
            echo "push step did not expose a digest" >&2
            exit 1
          fi
          for tag in ${TAGS}; do
            actual=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}")
            if [ "${actual}" != "${expected}" ]; then
              echo "Tag ${tag} resolves to ${actual}, expected ${expected}" >&2
              exit 1
            fi
            echo "Tag ${tag} -> ${actual} OK"
          done
