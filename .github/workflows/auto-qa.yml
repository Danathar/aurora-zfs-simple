---
name: Auto-QA tuning

# Compares the CI timeouts declared in .github/auto-qa-tuning.json against how
# long the jobs actually take, and reports where the two have drifted apart.
#
# The honest version of "self-tuning" for this repo. There is no coverage
# percentage to raise and no flake rate to learn from -- the coverage gate
# asserts a recorded decision and the shellcheck bar is zero output. The one
# number here that moves on its own is duration: `Build and push image` tracks
# the size and layer count of an upstream base this repo does not control, and
# a timeout written when the base had 128 layers is a different margin at 256.
# That is the same drift that produced the E2BIG rechunk failure, which also
# arrived with no commit on this side -- see
# docs/reflections/2026-08-25-large-json-through-the-environment.md.
#
# It proposes rather than edits. A workflow that rewrote its own timeouts would
# be changing a Tier 2 file unattended (docs/risk-tiers.md), and the useful
# output here is a number a human uses when deciding, not a commit.
#
# Fails only on the at-risk condition, in either of its two forms: a job whose
# slowest recent run has grown into its timeout, or a job that has already been
# killed at it. Both are an outage arriving on a schedule. "Timeout is looser
# than it needs to be" is written to the summary and never fails: it is
# information, and a red workflow nobody has to act on trains people to ignore
# red workflows.
#
# Those two forms need different samples, which is easy to get wrong. Duration
# comes from *successful* runs, because a run that failed for an unrelated
# reason says nothing about how long the work takes. But a job killed at its cap
# is a failure, and its run is not a success -- so sampling successes alone left
# this workflow blindest exactly when it mattered: once every current run dies
# at the cap, the only samples left are older and faster, and it reported "ok"
# while the build was broken. The second query exists for that case.

on:
  schedule:
    - cron: '15 08 * * 1'  # Mondays, after the weekend build has run
  workflow_dispatch:

concurrency:
  group: auto-qa
  cancel-in-progress: false

jobs:
  tune:
    name: Compare timeouts against observed durations
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare declared timeouts with observed durations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONFIG: .github/auto-qa-tuning.json
        run: |
          set -euo pipefail

          sample=$(jq -r '.policy.sample_size' "${CONFIG}")
          at_risk=$(jq -r '.policy.at_risk_ratio' "${CONFIG}")
          loose=$(jq -r '.policy.loose_ratio' "${CONFIG}")

          status=0
          {
            echo "### Auto-QA tuning"
            echo
            echo "Slowest of the last ${sample} successful runs, against the timeout"
            echo "declared in \`${CONFIG}\`."
            echo
            echo "| Workflow | Job | Timeout | Slowest run | Verdict |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          while IFS=$'\t' read -r workflow job timeout_min; do
            [ -n "${workflow}" ] || continue

            timeout_s=$((timeout_min * 60))
            # A job killed at its cap reports a duration a hair under it, so
            # allow a small margin rather than testing for equality.
            cap_s=$((timeout_s * 98 / 100))

            # Two questions, two samples, because they need different runs.
            #
            # How long does the work take when it completes? Successful runs
            # only -- a run that failed for an unrelated reason says nothing
            # about duration.
            success_ids=$(gh api \
              "repos/${REPO}/actions/workflows/${workflow}/runs?status=success&per_page=${sample}" \
              --jq '.workflow_runs[].id' 2>/dev/null || true)

            # Has the work already outgrown the cap? That evidence lives only in
            # runs the first query excludes: a job killed at `timeout-minutes` is
            # a *failure*, and its run is not `success`. Sampling successes alone
            # made this workflow blindest at the moment it matters -- once every
            # current run dies at the cap, the only samples left are the older,
            # faster ones, and it reports "ok" or "no successful runs sampled"
            # while the build is broken on a schedule. That is the exact drift it
            # was written to catch.
            completed_ids=$(gh api \
              "repos/${REPO}/actions/workflows/${workflow}/runs?status=completed&per_page=${sample}" \
              --jq '.workflow_runs[].id' 2>/dev/null || true)

            slowest=""
            timed_out=no

            for id in ${success_ids}; do
              d=$(gh api "repos/${REPO}/actions/runs/${id}/jobs" 2>/dev/null \
                | jq -r --arg job "${job}" '
                    .jobs[]?
                    | select(.name == $job and .conclusion == "success")
                    | select(.started_at != null and .completed_at != null)
                    | (.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)
                  ' || true)
              for value in ${d}; do
                if [ -z "${slowest}" ] || [ "${value}" -gt "${slowest}" ]; then
                  slowest="${value}"
                fi
              done
            done

            for id in ${completed_ids}; do
              # A failed job that ran to within 2% of its cap was killed by it.
              # The API exposes no "timed out" conclusion, so duration is the
              # signal; an ordinary test failure returns long before the cap and
              # does not match.
              f=$(gh api "repos/${REPO}/actions/runs/${id}/jobs" 2>/dev/null \
                | jq -r --arg job "${job}" '
                    .jobs[]?
                    | select(.name == $job and .conclusion == "failure")
                    | select(.started_at != null and .completed_at != null)
                    | (.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)
                  ' || true)
              for value in ${f}; do
                if [ "${value}" -ge "${cap_s}" ]; then
                  timed_out=yes
                fi
              done
            done

            if [ -n "${slowest}" ]; then
              pretty="$((slowest / 60))m$((slowest % 60))s"
            else
              pretty="_no successful runs sampled_"
            fi

            # Checked before everything else: a job already dying at the cap is
            # the at-risk condition in its most advanced form, and it is exactly
            # the case where `slowest` is stale or missing.
            if [ "${timed_out}" = "yes" ]; then
              printf '| %s | %s | %sm | %s | %s |\n' \
                "${workflow}" "${job}" "${timeout_min}" "${pretty}" \
                "**at risk** — a run has already been killed at the cap" \
                >> "${GITHUB_STEP_SUMMARY}"
              echo "::error::${workflow} / ${job}: a run was killed at its ${timeout_min}m timeout"
              status=1
              continue
            fi

            if [ -z "${slowest}" ]; then
              printf '| %s | %s | %sm | %s | — |\n' \
                "${workflow}" "${job}" "${timeout_min}" "${pretty}" \
                >> "${GITHUB_STEP_SUMMARY}"
              continue
            fi

            if awk -v d="${slowest}" -v t="${timeout_s}" -v r="${at_risk}" \
                 'BEGIN { exit !(d > t * r) }'; then
              verdict="**at risk** — raise the timeout or make the job faster"
              echo "::error::${workflow} / ${job}: slowest run ${pretty} exceeds ${at_risk} of its ${timeout_min}m timeout"
              status=1
            elif awk -v d="${slowest}" -v t="${timeout_s}" -v r="${loose}" \
                   'BEGIN { exit !(d < t * r) }'; then
              verdict="loose — could tighten (advisory)"
            else
              verdict="ok"
            fi

            printf '| %s | %s | %sm | %s | %s |\n' \
              "${workflow}" "${job}" "${timeout_min}" "${pretty}" "${verdict}" \
              >> "${GITHUB_STEP_SUMMARY}"
          done < <(jq -r '.jobs[] | [.workflow, .job, .timeout_minutes] | @tsv' "${CONFIG}")

          {
            echo
            echo "Only **at risk** fails this workflow. A loose timeout is reported and"
            echo "left alone; nothing here edits a workflow file."
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${status}"
