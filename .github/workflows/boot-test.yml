---
name: Boot test

# Boots the published image in a VM after every build.yml run on main and
# checks, over SSH, that it finished booting with ZFS installed and the zfs
# kernel module loaded.
#
# Every other check here reads the image as files. build.yml proves the ZFS
# packages and module files are in the image and that the pushed digest is
# signed, and nightly-compliance.yml that `:latest` still verifies; neither
# starts it. This is the one image in its family that replaces Aurora's kernel,
# so a kernel that does not boot, or a zfs.ko that does not load against it,
# would otherwise reach machines with no signal. ci/boot-test.sh does the work;
# this file only gives it a runner with KVM, a VM stack and disk space.
#
# It reports; it gates nothing. It runs after build.yml has already moved
# `:latest`, so a red run here means the boot test failed against the image a
# machine would pull right now: the image, or the runner that could not boot it
# (docs/ai-ops-runbook.md says how to tell). auto-issues.yml turns a red run
# that a build started into an issue.

on:
  # After build.yml finishes, not at a fixed time: a clock cannot know when a
  # slow or out-of-schedule build has promoted. build.yml runs weekly and on
  # every push to main, so `:latest` is booted at least once a week. When the
  # build failed (akmod skew, say) `:latest` did not move, and this boots the
  # unchanged image again, which is still the one machines run.
  #
  # `workflow_run` always runs this file's copy on the default branch with the
  # default branch's code, so a pull request cannot change what it runs. The
  # token holds `contents: read` and the job reads no secret.
  workflow_run:
    workflows: ["Build container image"]
    types:
      - completed
  workflow_dispatch:
  push:
    branches:
      - test/411-boot-test-hosted

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  boot:
    name: Boot the published image
    # Only builds of main, from this repository, are the ones that move
    # `:latest`. A pull request's build pushes nothing, so booting `:latest`
    # after it would test an image the pull request did not make. A cancelled
    # build was replaced by a newer one, which starts its own boot.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event != 'pull_request'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.conclusion != 'cancelled')
    # 26.04 ships podman 5 and a QEMU and virtiofsd new enough for bcvk.
    runs-on: ubuntu-26.04
    # Each of the at most two boots is bounded at fifteen minutes by
    # BOOT_TIMEOUT_SECONDS in ci/boot-test.sh, so the cap covers two timed-out
    # boots plus host setup and a slow pull. zfs-aurora-complex's boot of the
    # same Aurora base took six minutes in all (its run 39125903251).
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      WORK: ${{ github.workspace }}/boot-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # bcvk's own CI host setup, run as its CI runs it. Without it virtiofsd
      # exits before any VM starts on this runner image ("Error entering
      # sandbox: DropSupplementalGroups ... Operation not permitted"), as
      # atomic-image-builder's variant boot test found. Pinned by commit and
      # run before anything else touches podman.
      - name: Prepare the host the way bcvk's CI does
        env:
          BOOTC_ACTIONS_SHA: f77e18eca58220a5f8e82a115d65ee5973fcec83
          BOOTC_HOST_LIBVIRT: "true"
        run: |
          set -euo pipefail
          git clone -q https://github.com/bootc-dev/actions "${RUNNER_TEMP}/bootc-actions"
          git -C "${RUNNER_TEMP}/bootc-actions" checkout -q "${BOOTC_ACTIONS_SHA}"
          bash "${RUNNER_TEMP}/bootc-actions/bootc-host-setup/ci/install-deps.sh"
          bash "${RUNNER_TEMP}/bootc-actions/bootc-host-setup/ci/workarounds.sh"

      - name: Give the runner user KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # bcvk v0.19.0, the release zfs-aurora-complex and zfs-kinoite-complex
      # boot their Aurora and Kinoite images with. The tarball is checked
      # against its sha256 before it is unpacked, and the binary goes into
      # /usr/local/bin rather than onto GITHUB_PATH, so no later step's PATH
      # is edited.
      - name: Install the VM stack
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils virtiofsd skopeo
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/bcvk.tar.gz" \
            https://github.com/bootc-dev/bcvk/releases/download/v0.19.0/bcvk-x86_64-unknown-linux-gnu.tar.gz
          echo "e6e3e2e8c13546d30481b035217442de78f2efe3e5a3bd3dbfb58d38345b4b98  ${RUNNER_TEMP}/bcvk.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/bcvk.tar.gz" -C "${RUNNER_TEMP}" bcvk-x86_64-unknown-linux-gnu
          sudo install -m 0755 "${RUNNER_TEMP}/bcvk-x86_64-unknown-linux-gnu" /usr/local/bin/bcvk
          command -v bcvk

      # The image is several GB compressed and more unpacked. The root
      # filesystem's free space varies between runners; /mnt, where it exists,
      # is the larger disk.
      - name: Put container storage on the larger disk
        run: |
          set -euo pipefail
          df -h / /mnt 2>/dev/null || df -h /
          if [ -d /mnt ] && [ "$(df --output=avail -B1 /mnt | tail -1)" -gt "$(df --output=avail -B1 / | tail -1)" ]; then
            sudo mkdir -p /mnt/containers /mnt/tmp
            sudo chown "$(id -u):$(id -g)" /mnt/containers /mnt/tmp
            mkdir -p "${HOME}/.config/containers"
            printf '[storage]\ndriver = "overlay"\ngraphroot = "/mnt/containers/storage"\n' > "${HOME}/.config/containers/storage.conf"
            echo "TMPDIR=/mnt/tmp" >> "${GITHUB_ENV}"
          fi
          podman info --format '{{.Store.GraphRoot}}'

      - name: Boot the image and check ZFS
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
        run: ./ci/boot-test.sh --image "${IMAGE,,}" --work "${WORK}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-test-${{ github.run_id }}
          path: |
            ${{ env.WORK }}/result.json
            ${{ env.WORK }}/checks/
            ${{ env.WORK }}/boot-*/
          if-no-files-found: ignore
          retention-days: 30
