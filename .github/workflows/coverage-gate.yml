---
name: Coverage gate

# Closes a gap in `Build container image`, which is where the shell suite
# normally runs.
#
# That workflow sets `paths-ignore` for README.md and docs/**, so a pull request
# touching only those starts no run at all. A docs-only change was the one kind
# of change here that nothing verified — including the docs-versus-tree checks
# the suite is the natural home for.
#
# The trigger here covers the complement of that paths-ignore, so for a given
# change one workflow or the other runs the suite rather than both. A pull
# request touching docs *and* code trips both and runs it twice; that costs
# under a minute and is not worth a filter to avoid.
#
# `.github/workflows/**` is the deliberate exception to "one or the other", and
# it is here for a reason that is easy to miss. A `pull_request` run executes the
# *head* branch's copy of a workflow file (measured on this repo — see
# docs/SECURITY-AI.md), so a pull request that deletes the `Shell tests` job from
# build.yml is checked by the build.yml that no longer has it. The suite that
# would have failed is the suite that no longer runs, and build_push proceeds.
#
# Triggering here on any workflow change means that edit is still checked, by a
# workflow the pull request did not touch: tests/test-ci-workflows.sh runs and
# fails. The two files verify each other, so disabling the gate takes an edit to
# both in one pull request rather than one line in one file. Closing that last
# gap needs a required status check in branch protection, which is not something
# a file in the tree can assert.
#
# The coverage assertion itself lives in tests/test-coverage.sh, so it runs
# locally too. This workflow is where it is enforced, not where it is defined.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'README.md'
      - '**/README.md'
      - 'docs/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - '**/README.md'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Shell tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tests/test-shell-syntax.sh skips its shellcheck pass when the tool is
      # absent, which keeps the suite usable on a developer machine. CI is where
      # that pass has to be enforced. PyYAML is required by the workflow check.
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          shellcheck --version

      - name: Run shell test suite
        env:
          WORKFLOW_PYTHON: /usr/bin/python3
        run: ./tests/run-tests.sh
